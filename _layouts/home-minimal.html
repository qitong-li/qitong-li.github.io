---
---
{% include base_path %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.author.bio | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}">
  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/hachiware.png"/>
  <link rel="icon" type="image/png" href="{{ base_path }}/images/hachiware.png"/>
  <meta name="theme-color" content="#ffffff">
  <!-- Google Fonts: Playfair Display (fancy serif headings) + DM Sans (clean body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <style>
    /* ── CYM palette: hot pink + teal, refined for a personal academic site ── */
    :root {
      --pink:         #c94fa3;   /* CYM hot pink, slightly toned for legibility */
      --pink-light:   #fdf0f9;   /* blush background */
      --pink-mid:     #f2d4ea;   /* soft pink for dividers / cards */
      --teal:         #2ab8b2;   /* CYM bright teal */
      --teal-dark:    #1e8c87;
      --teal-light:   #d6f5f4;
      --text:         #170d14;   /* near-black with a hint of pink */
      --text-mid:     #5a3d55;
      --text-light:   #9a7a92;
      --white:        #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: var(--text);
      background: var(--pink-light);
      margin: 0;
      padding: 0;
    }

    /* ── Top accent bar ── */
    body::before {
      content: '';
      display: block;
      height: 5px;
      background: linear-gradient(90deg, var(--pink) 0%, var(--teal) 100%);
    }

    .mh-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.75rem 5rem;
    }

    /* ── Header ── */
    .mh-header { margin-bottom: 1.4rem; }

    .mh-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.6rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      color: var(--pink);
      letter-spacing: -0.02em;
    }

    .mh-subtitle {
      color: var(--text-mid);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin: 0 0 1rem;
    }

    .mh-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .mh-nav a {
      color: var(--white);
      background: var(--teal);
      text-decoration: none;
      padding: 0.28em 0.85em;
      border-radius: 999px;
      transition: background 0.18s, color 0.18s;
    }

    .mh-nav a:hover {
      background: var(--pink);
      color: var(--white);
    }

    /* ── Divider ── */
    hr {
      border: none;
      height: 2px;
      background: linear-gradient(90deg, var(--pink-mid) 0%, var(--teal-light) 100%);
      margin: 1.75rem 0;
    }

    /* ── Profile row ── */
    .mh-profile {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      margin: 1.5rem 0 1.25rem;
    }

    .mh-avatar {
      width: 148px;
      height: 148px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 3px solid var(--pink);
      box-shadow: 6px 6px 0 var(--pink-mid);
    }

    .mh-bio { flex: 1; }

    /* ── Content typography ── */
    .mh-content h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      font-style: italic;
      color: var(--text);
      margin: 2.25rem 0 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .mh-content h2::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--pink-mid), transparent);
      border-radius: 1px;
    }

    .mh-content p,
    .mh-bio p {
      margin: 0 0 0.9rem;
    }

    .mh-content ul,
    .mh-bio ul {
      padding-left: 1.4rem;
      margin: 0 0 0.9rem;
    }

    .mh-content ul li,
    .mh-bio ul li {
      margin-bottom: 0.35rem;
    }

    .mh-content a,
    .mh-bio a {
      color: var(--teal-dark);
      text-decoration: underline;
      text-decoration-color: var(--teal-light);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      transition: color 0.15s, text-decoration-color 0.15s;
    }

    .mh-content a:hover,
    .mh-bio a:hover {
      color: var(--pink);
      text-decoration-color: var(--pink-mid);
    }

    /* ── News section ── */
    .news-list {
      list-style: none;
      padding: 0;
      margin: 0 0 0.9rem;
    }

    .news-list li {
      display: flex;
      gap: 1rem;
      padding: 0.55rem 0.75rem;
      margin-bottom: 0.4rem;
      border-radius: 8px;
      background: var(--white);
      border-left: 3px solid var(--pink);
      font-size: 0.95rem;
      box-shadow: 0 1px 3px rgba(201,79,163,0.07);
    }

    .news-date {
      color: var(--pink);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      min-width: 5.5rem;
      padding-top: 0.2em;
    }

    /* ── Publication entries ── */
    .pub-entry {
      margin-bottom: 1.5rem;
    }

    .pub-with-img {
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      background: var(--white);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      box-shadow: 0 2px 10px rgba(201,79,163,0.09);
      border: 1px solid var(--pink-mid);
    }

    .pub-thumb {
      width: 115px;
      height: 82px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      border: 2px solid var(--pink-mid);
    }

    .pub-info { flex: 1; }

    .pub-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      display: block;
      margin-bottom: 0.2rem;
      line-height: 1.45;
    }

    .pub-title a {
      color: var(--text) !important;
      text-decoration-color: var(--pink-mid) !important;
    }

    .pub-title a:hover {
      color: var(--pink) !important;
      text-decoration-color: var(--pink) !important;
    }

    .pub-authors {
      color: var(--text-mid);
      font-size: 0.87rem;
      display: block;
      margin-bottom: 0.3rem;
      line-height: 1.5;
    }

    .pub-authors strong {
      color: var(--text);
      font-weight: 600;
    }

    .pub-meta {
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.1rem;
    }

    .badge {
      display: inline-block;
      background: var(--teal);
      color: var(--white);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15em 0.6em;
      border-radius: 999px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pub-meta a {
      color: var(--teal-dark) !important;
    }

    /* ── Footer ── */
    .mh-footer {
      margin-top: 3.5rem;
      padding: 1.1rem 1.4rem;
      background: linear-gradient(135deg, var(--pink) 0%, #a33b87 100%);
      border-radius: 12px;
      font-size: 0.84rem;
      color: rgba(255,255,255,0.9);
    }

    .mh-footer a { color: var(--white); text-decoration: none; font-weight: 600; }
    .mh-footer a:hover { text-decoration: underline; }

    /* ── Side decorations ── */
    .deco-side {
      position: fixed;
      top: 0;
      bottom: 0;
      width: calc((100vw - 760px) / 2 - 1.75rem);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      opacity: 0;
    }

    .deco-side i {
      font-size: 1.5rem;
      display: block;
    }

    @media (min-width: 1060px) {
      .deco-side { opacity: 1; }
    }

    .deco-left  { left: 0; }
    .deco-right { right: 0; }

    .deco-side i:nth-child(odd)  { color: var(--pink);      opacity: 0.18; transform: rotate(-12deg); }
    .deco-side i:nth-child(even) { color: var(--teal);      opacity: 0.18; transform: rotate(10deg);  }
    .deco-side i:nth-child(3n)   { font-size: 1.1rem; opacity: 0.13; transform: rotate(-6deg); }
    .deco-side i:nth-child(5n)   { font-size: 1.9rem; opacity: 0.14; transform: rotate(18deg); }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .mh-wrap { padding: 2rem 1.1rem 3rem; }
      .mh-profile { flex-direction: column; }
      .mh-avatar { width: 110px; height: 110px; }
      .mh-name { font-size: 2rem; }
      .pub-with-img { flex-direction: column; }
      .pub-thumb { width: 100%; height: 140px; }
      .mh-nav a { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <!-- left decoration strip -->
  <div class="deco-side deco-left" aria-hidden="true">
    <i class="fa-solid fa-leaf"></i>
    <i class="fa-solid fa-microchip"></i>
    <i class="fa-solid fa-seedling"></i>
    <i class="fa-solid fa-wifi"></i>
    <i class="fa-solid fa-dna"></i>
    <i class="fa-solid fa-graduation-cap"></i>
    <i class="fa-solid fa-flask"></i>
    <i class="fa-solid fa-atom"></i>
  </div>

  <!-- right decoration strip -->
  <div class="deco-side deco-right" aria-hidden="true">
    <i class="fa-solid fa-atom"></i>
    <i class="fa-solid fa-seedling"></i>
    <i class="fa-solid fa-wifi"></i>
    <i class="fa-solid fa-leaf"></i>
    <i class="fa-solid fa-graduation-cap"></i>
    <i class="fa-solid fa-microchip"></i>
    <i class="fa-solid fa-dna"></i>
    <i class="fa-solid fa-flask"></i>
  </div>

  <div class="mh-wrap">

    <header class="mh-header">
      <h1 class="mh-name">{{ site.author.name }}</h1>
      <p class="mh-subtitle">Ubiquitous Computing &middot; Plant Biology  &middot; Education</p>
      <nav class="mh-nav">
        <a href="{{ base_path }}/">Home</a>
        <a href="{{ base_path }}/#publications">Publications</a>
        <a href="{{ base_path }}/news/">News</a>
        <a href="{{ base_path }}/files/Research_CV.pdf" target="_blank">CV</a>
        <a href="{{ base_path }}/#contact">Contact</a>
      </nav>
      <hr>
    </header>

    <main class="mh-content">
      {{ content }}
    </main>

    <footer class="mh-footer">
      &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
    </footer>

  </div>

  <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>
</body>
</html>
